services:
  db:
    image: mysql:8.0
    container_name: formengine_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-formengine}
      MYSQL_USER: ${DB_USERNAME:-formengine}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 3s
      timeout: 5s
      retries: 15

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: formengine_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - "${PHPMYADMIN_PORT:-8085}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
