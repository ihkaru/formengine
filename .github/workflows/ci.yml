name: Deploy Laravel to desa-sm.dvlp.asia

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: FTP Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, openssl, json

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Sync Core Laravel Application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER_DESA_SM }}
          password: ${{ secrets.FTP_PASSWORD_DESA_SM }}
          port: 21
          protocol: ftp
          security: loose
          local-dir: ./
          server-dir: ./desa-sm.dvlp.asia/
          exclude: |
            .git/**
            .github/**
            node_modules/**
            vendor/**
            public/**
            storage/*.key
            storage/logs/*
            storage/framework/cache/*
            storage/framework/sessions/*
            storage/framework/views/*

      - name: Sync Public Web Assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER_DESA_SM }}
          password: ${{ secrets.FTP_PASSWORD_DESA_SM }}
          port: 21
          protocol: ftp
          security: loose
          local-dir: ./public/
          server-dir: ./public_html/desa-sm.dvlp.asia/
          exclude: |
            .git/**
            index.php
